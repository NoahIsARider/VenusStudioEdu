apiVersion: v1
kind: Pod
metadata:
  name: app-pod
  labels:
    app: myapp
spec:
  containers:
  - name: app-container
    image: nginx:1.21
    ports:
    - containerPort: 80
    env:
    # 从ConfigMap中注入环境变量
    - name: DATABASE_URL
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: database.url
    - name: LOG_LEVEL
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: log.level
    # 从Secret中注入环境变量
    - name: DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: password
    volumeMounts:
    # 挂载ConfigMap作为卷
    - name: config-volume
      mountPath: /etc/config
    # 挂载Secret作为卷
    - name: secret-volume
      mountPath: /etc/secret
      readOnly: true
  volumes:
  # 配置ConfigMap卷
  - name: config-volume
    configMap:
      name: app-config
  # 配置Secret卷
  - name: secret-volume
    secret:
      secretName: db-secret
