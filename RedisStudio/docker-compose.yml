version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-studio-db
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - redis_network

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis-studio-insight
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - redis_insight_data:/db
    depends_on:
      - redis
    networks:
      - redis_network

volumes:
  redis_data:
  redis_insight_data:

networks:
  redis_network:
    driver: bridge